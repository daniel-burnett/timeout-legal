name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from the main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already exists"
            cat /tmp/pages.json
            exit 0
          fi
          echo "GET pages failed:"
          cat /tmp/pages.err
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/pages"
